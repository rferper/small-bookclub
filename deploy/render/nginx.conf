pid /tmp/nginx.pid;
error_log /dev/null;
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    server {
        listen __PORT__;
        server_name _;
        root /app/frontend/dist;
        index index.html;
        server_tokens off;
        client_max_body_size 3m;
        limit_conn client_connections 20;
        limit_req_status 429;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=3600" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location /api/ {
            limit_req zone=api_requests burst=30 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            # Render owns public TLS; clients cannot reach private Gunicorn.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_read_timeout 65s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
