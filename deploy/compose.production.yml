# Explicit override: always use with the repository docker-compose.yml first.
services:
  backend:
    environment:
      BOOKCLUB_ENV: production
      DEBUG: "false"
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:?Set a private generated SECRET_KEY}
      ALLOWED_HOSTS: ${BOOKCLUB_HOST:?Set one explicit DNS hostname}
      TRUST_HTTPS_PROXY: "true"
      DISCORD_REDIRECT_URI: https://${BOOKCLUB_HOST}/api/auth/discord/callback
    volumes:
      - ${BACKUP_DIRECTORY:?Set an absolute private backup directory}:/backups
    networks: [application]
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host': os.environ['ALLOWED_HOSTS'], 'X-Forwarded-Proto': 'https'}), timeout=5)"]
  frontend:
    ports: !reset []
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [application, edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    environment:
      BOOKCLUB_HOST: ${BOOKCLUB_HOST}
      TLS_ISSUER: ${TLS_ISSUER:-acme}
    ports:
      - "${BOOKCLUB_BIND_IP:-0.0.0.0}:${BOOKCLUB_HTTP_PORT:-80}:80"
      - "${BOOKCLUB_BIND_IP:-0.0.0.0}:${BOOKCLUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    init: true
    restart: unless-stopped

networks:
  application:
  edge:

volumes:
  caddy_data:
  caddy_config:
