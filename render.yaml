# Fictional, resetting demos only. CI controls delivery; native auto-deploy is off.
services:
  - type: web
    name: small-bookclub-staging
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: CLUB_TIMEZONE
        value: Europe/Madrid
  - type: web
    name: small-bookclub-demo
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: 'true'
      - key: SECRET_KEY
        generateValue: true
      - key: CLUB_TIMEZONE
        value: Europe/Madrid
