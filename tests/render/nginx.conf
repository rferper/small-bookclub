# TLS test fixture: proxy ALL assets/API to the single Render artifact.
server {
    listen 8080;
    access_log off;
    error_log /dev/null;
    location / {
        proxy_pass http://backend:10000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
    }
}
