# Explicit disposable check only; the outer frontend proxies the Render image.
services:
  backend:
    build:
      dockerfile: deploy/render/Dockerfile
    environment:
      DEMO_MODE: 'true'
      DATABASE_PATH: /tmp/bookclub-render/club.sqlite3
      MEDIA_ROOT: /tmp/bookclub-render/private_media
      RENDER_EXTERNAL_HOSTNAME: ${BOOKCLUB_HOST}
      RENDER_GIT_COMMIT: '1111111111111111111111111111111111111111'
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?Set the fictional verification world}
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
    volumes: !reset []
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:10000/api/health', headers={'Host':os.environ['RENDER_EXTERNAL_HOSTNAME']}), timeout=5)"]
  frontend:
    volumes:
      - ./tests/render/nginx.conf:/etc/nginx/conf.d/default.conf:ro
