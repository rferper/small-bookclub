  /api/auth/discord/start:
    get:
      operationId: startSignIn
      summary: Same-site OAuth navigation
      tags:
        - Session
      security: []
      parameters:
        - name: purpose
          in: query
          required: false
          schema:
            type: string
            enum:
              - login
              - export
            default: login
          description: "Default login; export requires the current approved admin. Server-held one-use
            OAuth state expires after ten minutes. Invalid purpose returns safely to / without OAuth.
            Arbitrary next/return URLs are ignored."
      description: Top-level navigation, not JSON sign-in. Discord identify scope only; approved exact
        IDs, revoke check, state and identity checked server-side. Server-held same-origin return
        navigation; deny missing/invalid state without club payload. No access/refresh tokens
        exposed. Export purpose performs admin reauthentication (#102). For purpose=export require
        existing approved admin and bind server OAuth state to that same identity; require a fresh
        provider authentication, not reuse of prior local confirmation. Callback records server
        recent-auth time only after state, identity and current allowlist/admin checks; wrong
        identity never authorises export. Login returns to /; eligible export returns to
        /administracion. Anonymous/ineligible export returns to /, eligible non-admin to
        /administracion without OAuth. Responses are noncached; absent configuration gives safe 503.
      responses:
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "302":
          description: Redirect to Discord authorisation from start, or safe same-origin page/session gate
            after callback. Failure lands on anonymous/denied Spanish page; no club payload.
          headers:
            Location:
              required: true
              description: Provider URL (start) or validated same-origin page (callback).
              schema:
                type: string
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
  /api/auth/discord/callback:
    get:
      operationId: discordCallback
      summary: Same-site OAuth navigation
      tags:
        - Session
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Provider response; validate OAuth state and exact approved identity server-side. Never
            echo values.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Provider response; validate OAuth state and exact approved identity server-side. Never
            echo values.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Provider response; validate OAuth state and exact approved identity server-side. Never
            echo values.
      description: Top-level navigation, not JSON sign-in. Discord identify scope only; approved exact
        IDs, revoke check, state and identity checked server-side. Server-held same-origin return
        navigation; deny missing/invalid state without club payload. No access/refresh tokens
        exposed. Export purpose performs admin reauthentication (#102). For server-held export
        purpose, successful fresh provider authentication must match original approved admin
        identity and rechecked allowlist/admin role before server stores recent-auth timestamp.
        Absent/stale authorisation later yields export 409 without expiring approved session. No
        tokens exposed. State is one-use and expires after ten minutes. Ordinary failure returns to /
        with denied status; failed export preserves an eligible session and clears freshness.
        Successful export returns to /administracion; ordinary login never grants freshness.
        All responses are noncached.
      responses:
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "302":
          description: Redirect to Discord authorisation from start, or safe same-origin page/session gate
            after callback. Failure lands on anonymous/denied Spanish page; no club payload.
          headers:
            Location:
              required: true
              description: Provider URL (start) or validated same-origin page (callback).
              schema:
                type: string
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
