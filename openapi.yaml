  /api/votes/{voteId}/candidates:
    post:
      operationId: addCandidate
      summary: addCandidate
      description: 401 then current curator/admin 403 before lookup, vote/book 404 then
        closed/duplicate/non-propuesto book 409, invalid input 400. Append candidate.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
              example:
                id: book-fiction-1
                status: draft
                curator:
                  id: book-fiction-1
                  displayName: Texto ficticio
                  avatarUrl: null
                openedAt: null
                closedAt: null
                candidates: []
                outcome: null
