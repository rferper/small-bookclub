              bookId: book-fiction-1
  /api/votes/{voteId}/candidates/{bookId}:
    delete:
      operationId: removeCandidate
      summary: removeCandidate
      description: 401 then current curator/admin 403, unknown vote/candidate 404, closed or open
        shortlist <=2 409. Remove all approvals atomically.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
              example:
                id: book-fiction-1
                status: draft
                curator:
                  id: book-fiction-1
                  displayName: Texto ficticio
                  avatarUrl: null
                openedAt: null
                closedAt: null
                candidates: []
                outcome: null
                canManage: false
                canRecordTieWinner: false
                curatedByMe: false
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
