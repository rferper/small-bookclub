openapi: 3.1.0
info:
  title: Small Bookclub API
  version: 1.2.0
  description: "Private Spanish book club member (#71) and administration (#102) contract. Future
    same-site cookie club API; health and finite Discord/session/logout are implemented, with a backend default membership guard. Approved access rechecked on
    every request. Generated adoption #103, backend response validation #72. See docs/api.md."
servers:
  - url: /
    description: Same origin; local HTTP development permitted. HTTPS deployment required for Secure cookies.
tags:
  - name: Session
    description: Session and same-site OAuth navigation.
  - name: Member
    description: Approved member data; admin follows same spoiler gates in member views.
  - name: Admin
    description: Effective approved admin only; explicit operational/editor projections. Curator not admin.
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Public process liveness
      description: Implemented bootstrap; does not query the database or external providers.
      security: []
      responses:
        "200":
          description: The API process is responding.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
  /api/session:
    get:
      operationId: getSession
      summary: getSession
      description: Always 200 anonymous/denied/signedIn; bootstraps csrftoken cookie. Recheck
        allowlist/revocation server-side. No second current-user endpoint.
      tags:
        - Session
      responses:
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                status: anonymous
                demoSignInAvailable: false
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security: []
  /api/auth/logout:
    post:
      operationId: signOut
      summary: signOut
      description: Idempotent logout even without authenticated membership. CSRF required; invalidate
        session cookie.
      tags:
        - Session
      responses:
        "204":
          description: Successful; no response body.
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - csrfHeader: []
  /api/auth/demo:
    post:
      operationId: startDemoSignIn
      summary: startDemoSignIn
      description: CSRF required. DEMO_MODE only, establishes fictional session; otherwise generic 404.
        Never available on real club instance.
      tags:
        - Session
      responses:
        "204":
          description: Successful; no response body.
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - csrfHeader: []
  /api/home:
    get:
      operationId: getHome
      summary: getHome
      description: Home is gated server-side before activity text and review totals are composed;
        ratings/records cannot leak via card/feed counts.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
              example:
                currentBook: null
                currentWeek: null
                nextMeeting: null
                memberProgress: []
                recentActivity: []
                stats:
                  booksCompleted: 0
                  reviews: 0
                  members: 0
                quote: null
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
  /api/weeks/{weekId}/completion:
    put:
      operationId: setWeekCompleted
      summary: setWeekCompleted
      description: Own session identity only; 403 smuggled ownership, 401 before lookup, unknown/removed
        week 404 before invalid input. Independent from finished flag; idempotent.
      tags:
        - Member
      responses:
        "204":
          description: Successful; no response body.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque weekId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekCompletionInput"
            example:
              completed: false
  /api/books:
    get:
      operationId: listBooks
      summary: listBooks
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryBook"
              example: []
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
  /api/books/{bookId}:
    get:
      operationId: getBook
      summary: getBook
      description: Approved membership rechecked before data lookup. See docs/api.md for server
