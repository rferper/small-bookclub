            example:
              memberId: null
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: "Server session cookie, HttpOnly; Secure in HTTPS deployment; SameSite=Lax for OAuth.
        Local HTTP does not claim Secure cookies. Approved membership/revocation rechecked each
        request. Names reversible for #5."
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: "CSRF cookie csrftoken bootstrapped by GET /api/session and sent as X-CSRFToken on
        unsafe JSON/multipart/logout/demo requests. Not authentication. Wrong/missing ->403
        forbidden. Cookie flow reversible #5."
  schemas:
    Id:
      type: string
      minLength: 1
      description: Opaque website identifier, not necessarily UUID; never a Discord identity.
      examples:
        - book-fiction-1
    Instant:
      type: string
      format: date-time
      description: ISO 8601 instant with offset; server clock and configured club timezone govern ordering.
      examples:
        - 2026-01-15T19:00:00Z
    CalendarDate:
      type: string
      format: date
      description: Calendar date YYYY-MM-DD without a timezone. Approximate historical dates use this
        best-known date plus datesApproximate; unknown dates are null.
      examples:
        - 1985-01-01
    MemberSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
        avatarUrl:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - displayName
        - avatarUrl
      examples:
        - id: book-fiction-1
          displayName: Texto ficticio
          avatarUrl: null
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
        role:
          type: string
          enum:
            - admin
            - member
        avatarUrl:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - displayName
        - role
        - avatarUrl
      examples:
        - id: book-fiction-1
          displayName: Texto ficticio
          role: admin
          avatarUrl: null
    SessionAnonymous:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: anonymous
        demoSignInAvailable:
          type: boolean
      required:
        - status
        - demoSignInAvailable
      examples:
        - status: anonymous
          demoSignInAvailable: false
    SessionDenied:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: denied
        demoSignInAvailable:
          type: boolean
      required:
        - status
        - demoSignInAvailable
      examples:
        - status: denied
          demoSignInAvailable: false
    SessionSignedIn:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: signedIn
        user:
          $ref: "#/components/schemas/CurrentUser"
      required:
        - status
        - user
      examples:
        - status: signedIn
          user:
            id: member-fiction-1
            displayName: Lucía
            role: member
            avatarUrl: null
    Session:
      oneOf:
        - $ref: "#/components/schemas/SessionAnonymous"
        - $ref: "#/components/schemas/SessionDenied"
        - $ref: "#/components/schemas/SessionSignedIn"
      discriminator:
        propertyName: status
        mapping:
          anonymous: "#/components/schemas/SessionAnonymous"
          denied: "#/components/schemas/SessionDenied"
          signedIn: "#/components/schemas/SessionSignedIn"
      description: Only signedIn carries a website user. Anonymous/denied carry no club information. Demo
        availability is false in production; no tokens, Discord IDs, secrets or passwords are
        exposed. Revoked sessions are refused.
      examples:
        - status: anonymous
          demoSignInAvailable: false
    BookSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        coverUrl:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - title
        - authors
        - coverUrl
      examples:
        - id: book-fiction-1
          title: Texto ficticio
          authors: []
          coverUrl: null
    MeetingAssignment:
      type: object
      additionalProperties: false
      properties:
        weekNumber:
          type: integer
          minimum: 1
        percentStart:
          type: number
          minimum: 0
        percentEnd:
          type: number
          minimum: 0
        pageStart:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        pageEnd:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - weekNumber
        - percentStart
        - percentEnd
        - pageStart
        - pageEnd
      examples:
        - weekNumber: 1
          percentStart: 0
          percentEnd: 0
          pageStart: 1
          pageEnd: 1
    ReadingWeek:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        weekNumber:
          type: integer
          minimum: 1
        percentStart:
          type: number
          minimum: 0
        percentEnd:
          type: number
          minimum: 0
        pageStart:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        pageEnd:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        meetingStartsAt:
          anyOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        completedByMe:
          type: boolean
      required:
        - id
        - weekNumber
        - percentStart
        - percentEnd
        - pageStart
        - pageEnd
        - meetingStartsAt
        - completedByMe
      examples:
        - id: book-fiction-1
          weekNumber: 1
          percentStart: 0
          percentEnd: 0
          pageStart: 1
          pageEnd: 1
          meetingStartsAt: null
          completedByMe: false
    NextMeeting:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        startsAt:
          $ref: "#/components/schemas/Instant"
        book:
          anyOf:
            - $ref: "#/components/schemas/BookSummary"
            - type: "null"
        assignment:
          anyOf:
            - $ref: "#/components/schemas/MeetingAssignment"
            - type: "null"
      required:
        - id
        - startsAt
        - book
        - assignment
      examples:
        - id: book-fiction-1
          startsAt: 2026-01-15T19:00:00Z
          book: null
          assignment: null
    MemberProgress:
      type: object
      additionalProperties: false
      properties:
        member:
          $ref: "#/components/schemas/MemberSummary"
        completed:
          type: boolean
      required:
        - member
        - completed
      examples:
        - member:
            id: book-fiction-1
            displayName: Texto ficticio
            avatarUrl: null
          completed: false
    ActivityEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum:
            - book_selected
            - vote_opened
            - vote_closed
            - nomination_added
            - summary_published
            - review_available
        occurredAt:
          $ref: "#/components/schemas/Instant"
        text:
          type: string
      required:
        - id
        - type
        - occurredAt
        - text
      description: Spanish plain text composed server-side AFTER gates. review_available requires a
        canonical visible book the viewer finished AND fully rated. summary_published requires a
        canonical visible noncancelled meeting with an actually published summary and the existing
        completed-active-week or explicitly-safe-unlinked record gate. Removed linked weeks stay
        blocked. Omit unverifiable subject references. No hidden content or inference via labels.
      examples:
        - id: book-fiction-1
          type: book_selected
          occurredAt: 2026-01-15T19:00:00Z
          text: Texto ficticio
    ClubStats:
      type: object
      additionalProperties: false
      properties:
        booksCompleted:
          type: integer
          minimum: 0
        reviews:
          type: integer
          minimum: 0
        members:
          type: integer
          minimum: 0
      required:
        - booksCompleted
        - reviews
        - members
      description: Books with terminado status and active member count are public to members. reviews
        counts only reviews for viewer-unlocked books (finished AND full own rating), never a hidden
        global total.
      examples:
        - booksCompleted: 0
          reviews: 0
          members: 0
    LiteraryQuote:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        author:
          anyOf:
            - type: string
            - type: "null"
        source:
          anyOf:
            - type: string
            - type: "null"
      required:
        - text
        - author
        - source
      examples:
        - text: Texto ficticio
          author: null
          source: null
    HomeData:
      type: object
      additionalProperties: false
      properties:
        currentBook:
          anyOf:
            - $ref: "#/components/schemas/BookSummary"
            - type: "null"
        currentWeek:
          anyOf:
            - $ref: "#/components/schemas/ReadingWeek"
            - type: "null"
        nextMeeting:
          anyOf:
            - $ref: "#/components/schemas/NextMeeting"
            - type: "null"
        memberProgress:
          type: array
          items:
            $ref: "#/components/schemas/MemberProgress"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        stats:
          $ref: "#/components/schemas/ClubStats"
        quote:
          anyOf:
            - $ref: "#/components/schemas/LiteraryQuote"
            - type: "null"
      required:
        - currentBook
        - currentWeek
        - nextMeeting
        - memberProgress
        - recentActivity
        - stats
        - quote
      examples:
        - currentBook: null
          currentWeek: null
          nextMeeting: null
          memberProgress: []
          recentActivity: []
          stats:
            booksCompleted: 0
            reviews: 0
            members: 0
          quote: null
    LibraryBook:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        coverUrl:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum:
            - propuesto
            - elegido
            - leyendo
            - terminado
            - archivado
        readingStartDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        readingEndDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        datesApproximate:
          type: boolean
      required:
        - id
        - title
        - authors
        - coverUrl
        - status
        - readingStartDate
        - readingEndDate
        - datesApproximate
      description: Catalogue metadata only; no review/count/mean/meeting record keys. Unsorted list;
        client applies existing local filters/sorts.
      examples:
        - id: book-fiction-1
          title: Texto ficticio
          authors: []
          coverUrl: null
          status: propuesto
          readingStartDate: null
          readingEndDate: null
          datesApproximate: false
    ScheduleMeeting:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        startsAt:
          $ref: "#/components/schemas/Instant"
      required:
        - id
        - startsAt
      examples:
        - id: book-fiction-1
          startsAt: 2026-01-15T19:00:00Z
    ScheduleWeek:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        completedByMe:
          type: boolean
        weekNumber:
          type: integer
          minimum: 1
        percentStart:
          type: number
          minimum: 0
        percentEnd:
          type: number
          minimum: 0
        pageStart:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        pageEnd:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        dueDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        meeting:
          anyOf:
            - $ref: "#/components/schemas/ScheduleMeeting"
            - type: "null"
        notes:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - completedByMe
        - weekNumber
        - percentStart
        - percentEnd
        - pageStart
        - pageEnd
        - dueDate
        - meeting
        - notes
      examples:
        - id: book-fiction-1
          completedByMe: false
          weekNumber: 1
          percentStart: 0
          percentEnd: 0
          pageStart: 1
          pageEnd: 1
          dueDate: null
          meeting: null
          notes: null
    BookMeeting:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        startsAt:
          $ref: "#/components/schemas/Instant"
        cancelled:
          type: boolean
        weekNumber:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
      required:
        - id
        - startsAt
        - cancelled
        - weekNumber
      examples:
        - id: book-fiction-1
          startsAt: 2026-01-15T19:00:00Z
          cancelled: false
          weekNumber: null
    OriginVote:
      type: object
      additionalProperties: false
      description: Server-owned first recorded winning election for this book; null in containing
        projections while that election has any removed candidate. Later wins never replace the origin.
      properties:
        id:
          $ref: "#/components/schemas/Id"
        label:
          type: string
      required:
        - id
        - label
      examples:
        - id: book-fiction-1
          label: Texto ficticio
    BookDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        coverUrl:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum:
            - propuesto
            - elegido
            - leyendo
            - terminado
            - archivado
        readingStartDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        readingEndDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        datesApproximate:
          type: boolean
        plannedStartDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        plannedEndDate:
          anyOf:
            - $ref: "#/components/schemas/CalendarDate"
            - type: "null"
        description:
          anyOf:
            - type: string
            - type: "null"
        publicationDate:
          anyOf:
            - type: string
            - type: "null"
        publisher:
          anyOf:
            - type: string
            - type: "null"
        isbn:
          anyOf:
            - type: string
            - type: "null"
        pageCount:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleWeek"
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/BookMeeting"
        originVote:
          anyOf:
            - $ref: "#/components/schemas/OriginVote"
            - type: "null"
      required:
        - id
        - title
        - authors
        - coverUrl
        - status
        - readingStartDate
        - readingEndDate
        - datesApproximate
        - plannedStartDate
        - plannedEndDate
        - description
        - publicationDate
        - publisher
        - isbn
        - pageCount
        - schedule
