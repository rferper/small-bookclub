            $ref: "#/components/schemas/Id"
          description: Opaque voteId.
        - name: bookId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque bookId.
  /api/votes/{voteId}/candidates/order:
    put:
      operationId: reorderCandidates
      summary: reorderCandidates
      description: 401 then permission 403, vote/any book lookup 404, closed or stale/non-exact candidate
        set 409, malformed input 400.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
