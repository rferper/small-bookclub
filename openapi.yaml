    ProfileMetadata:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          x-trimmedMinLength: 1
          x-trimmedMaxLength: 40
          description: Trim, then 1..40 chars single line. Reject control characters incl U+2028/U+2029.
        bio:
          anyOf:
            - type: string
              x-trimmedMaxLength: 500
            - type: "null"
        favouriteQuote:
          anyOf:
            - type: string
              x-trimmedMaxLength: 300
            - type: "null"
        favouriteBookIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          maxItems: 5
          uniqueItems: true
        avatarAction:
          type: string
          enum:
            - keep
            - remove
            - replace
      required:
        - displayName
        - favouriteBookIds
        - avatarAction
      description: JSON metadata multipart part. Optional text missing/null/trimmed blank becomes null.
        Max lengths AFTER trim, server obligation. Favourites ordered distinct allowed IDs; reject
        whole transaction for any invalid value. Smuggled ownership keys 403, never used for
        ownership.
      examples:
        - displayName: Texto ficticio
          favouriteBookIds: []
          avatarAction: keep
    ProfileMultipart:
      type: object
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/ProfileMetadata"
        avatar:
          type: string
          format: binary
          description: JPEG/PNG/WebP bytes, >0 and <=2097152 bytes; required ONLY for replace. Server
            sniffs/validates content before atomic save.
          x-maxBytes: 2097152
      required:
        - metadata
      allOf:
        - if:
            properties:
              metadata:
                properties:
                  avatarAction:
                    const: replace
                required:
                  - avatarAction
            required:
              - metadata
          then:
            required:
              - avatar
          else:
            not:
              required:
                - avatar
      description: "Multipart adapter: metadata application/json part; avatar binary image part for
        replace. Browser File/AvatarChange never JSON objects."
      examples:
        - metadata:
            displayName: Texto ficticio
            favouriteBookIds: []
            avatarAction: keep
