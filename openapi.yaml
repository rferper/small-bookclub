          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque voteId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
            example:
              bookId: book-fiction-1
  /api/votes/{voteId}/candidates/{bookId}:
    delete:
      operationId: removeCandidate
      summary: removeCandidate
      description: 401 then current curator/admin 403, unknown vote/candidate 404, closed or open
        shortlist <=2 409. Remove all approvals atomically.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
              example:
                id: book-fiction-1
                status: draft
                curator:
                  id: book-fiction-1
                  displayName: Texto ficticio
