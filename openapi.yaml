      operationId: closeVote
      summary: closeVote
      description: 401 then permission 403, lookup 404, non-open 409. Server computes winner/tie. No body
        or automatic catalogue/curator changes.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
