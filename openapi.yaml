      tags:
        - Admin
      description: Effective approved admin only; recheck allowlist and role on server. 401 before 403;
        both before lookup/payload validation. Curator alone is denied. CSRF on unsafe methods.
        Atomic refusal changes nothing; member/own-profile gates apply to admin outside these
