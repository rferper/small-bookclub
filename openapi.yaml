  responses:
    TooManyRequests:
      description: Request budget exhausted. Retry after the indicated number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Demasiadas solicitudes.
    Error400:
      description: Datos no válidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_input
            message: Datos no válidos.
    Error401:
      description: Debes iniciar sesión.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Debes iniciar sesión.
    Error403:
      description: No tienes permiso para realizar esta acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: No tienes permiso para realizar esta acción.
    Error404:
      description: No se encuentra el recurso.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: No se encuentra el recurso.
    Error409:
      description: El estado actual no permite esta acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: conflict
            message: El estado actual no permite esta acción.
    Error500:
      description: No se ha podido completar la solicitud.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: No se ha podido completar la solicitud.
    Error503:
      description: El servicio no está disponible temporalmente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: service_unavailable
            message: El servicio no está disponible temporalmente.
