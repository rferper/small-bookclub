  /api/admin/members/{memberId}/revoke:
    post:
      operationId: revokeMember
      summary: revokeMember
      tags:
        - Admin
      description: Effective approved admin only; recheck allowlist and role on server. 401 before 403;
        both before lookup/payload validation. Curator alone is denied. CSRF on unsafe methods.
        Atomic refusal changes nothing; member/own-profile gates apply to admin outside these
        endpoints. Missing or nonnumeric native target ID 404; own account, already revoked or
        pending/unapproved target 409. Success revokes an approved member and atomically deletes
        all their existing authenticated database sessions. Old cookies cannot regain access after
        reapproval; a fresh Discord login is required. Refusals preserve timestamps and sessions.
        Retain identity, profile, role and contributions. At this stage no current-curator assignment
        is persisted; curator is null and all isCurator flags are false. Once assignment persistence
        exists, clear the current assignment atomically when its member is revoked.
      x-access:
        approvedAdmin: true
        anonymous: 401
        member: 403
        curator: 403
      responses:
        "200":
          description: Successful approved-admin result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMembers"
              example:
                members: []
                curator: null
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
  /api/admin/members/{memberId}/restore:
    post:
      operationId: restoreMember
      summary: restoreMember
      tags:
        - Admin
      description: Effective approved admin only; recheck allowlist and role on server. 401 before 403;
        both before lookup/payload validation. Curator alone is denied. CSRF on unsafe methods.
        Atomic refusal changes nothing; member/own-profile gates apply to admin outside these
        endpoints. Missing or nonnumeric native ID 404; active or pending/unapproved target 409.
        Only revoked rows are restored, preserving native identity, role and website profile.
        Clear revokedAt and approve access; old sessions/cookies never revive. Fresh Discord
        sign-in is required. Refusals preserve all data.
      x-access:
        approvedAdmin: true
        anonymous: 401
        member: 403
        curator: 403
      responses:
        "200":
          description: Successful approved-admin result.
          content:
            application/json:
