openapi: 3.1.0
info:
  title: Small Bookclub member API
  version: 1.0.0
  description: "Private Spanish book club; contract foundation/member operations (#71). Administration
    #102; generated types/mock adoption #103; backend response validation #72. This document
    implements no HTTP/security enforcement. Same-site cookie session; approved allowlist and
    revocation rechecked on every club request. See docs/api.md."
servers:
  - url: /
    description: Same origin; local HTTP development permitted. HTTPS deployment required for Secure cookies.
tags:
  - name: Session
    description: Session and same-site OAuth navigation.
  - name: Member
    description: Approved member data; admin follows same spoiler gates in member views.
security:
  - sessionCookie: []
paths:
  /api/session:
    get:
      operationId: getSession
      summary: getSession
      description: Always 200 anonymous/denied/signedIn; bootstraps csrftoken cookie. Recheck
        allowlist/revocation server-side. No second current-user endpoint.
      tags:
        - Session
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                status: anonymous
                demoSignInAvailable: false
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security: []
  /api/auth/logout:
    post:
      operationId: signOut
      summary: signOut
      description: Idempotent logout even without authenticated membership. CSRF required; invalidate
        session cookie.
      tags:
        - Session
      responses:
        "204":
          description: Successful; no response body.
        "403":
          $ref: "#/components/responses/Error403"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - csrfHeader: []
  /api/auth/demo:
    post:
      operationId: startDemoSignIn
      summary: startDemoSignIn
      description: CSRF required. DEMO_MODE only, establishes fictional session; otherwise generic 404.
        Never available on real club instance.
      tags:
        - Session
      responses:
        "204":
          description: Successful; no response body.
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - csrfHeader: []
  /api/home:
    get:
      operationId: getHome
      summary: getHome
      description: Home is gated server-side before activity text and review totals are composed;
        ratings/records cannot leak via card/feed counts.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeData"
              example:
                currentBook: null
                currentWeek: null
                nextMeeting: null
                memberProgress: []
                recentActivity: []
                stats:
                  booksCompleted: 0
                  reviews: 0
                  members: 0
                quote: null
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
  /api/weeks/{weekId}/completion:
    put:
      operationId: setWeekCompleted
      summary: setWeekCompleted
      description: Own session identity only; 403 smuggled ownership, 401 before lookup, unknown/removed
        week 404 before invalid input. Independent from finished flag; idempotent.
      tags:
        - Member
      responses:
        "204":
          description: Successful; no response body.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque weekId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekCompletionInput"
            example:
              completed: false
  /api/books:
    get:
      operationId: listBooks
      summary: listBooks
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryBook"
              example: []
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
  /api/books/{bookId}:
    get:
      operationId: getBook
      summary: getBook
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
              example:
                id: book-fiction-1
                title: Texto ficticio
                authors: []
                coverUrl: null
                status: propuesto
                readingStartDate: null
                readingEndDate: null
                datesApproximate: false
                plannedStartDate: null
                plannedEndDate: null
                description: null
                publicationDate: null
                publisher: null
                isbn: null
                pageCount: null
                schedule: []
                meetings: []
                originVote: null
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque bookId.
  /api/meetings:
    get:
      operationId: listMeetings
      summary: listMeetings
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingList"
              example:
                upcoming: []
                past: []
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
  /api/meetings/{meetingId}:
    get:
      operationId: getMeeting
      summary: getMeeting
      description: Central MeetingRecord gate includes admin member views; published content only;
        cancelled/removed linked week suppress substantive records.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetail"
              example:
                id: book-fiction-1
                startsAt: 2026-01-15T19:00:00Z
                cancelled: false
                book: null
                assignment: null
                upcoming: false
                attendance: null
                record:
                  status: visible
                  summary: null
                  highlights: []
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque meetingId.
  /api/votes:
    get:
      operationId: getVotes
      summary: getVotes
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotesOverview"
              example:
                curator: null
                current: null
                history: []
                canCreateVote: false
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
    post:
      operationId: createVote
      summary: createVote
      description: 401 then effective current curator/admin permission 403; missing curator or existing
        draft/open 409. Empty draft shortlist belongs to current curator even when admin creates. No
        request body.
      tags:
        - Member
      responses:
        "201":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
              example:
                id: book-fiction-1
                status: draft
                curator:
                  id: book-fiction-1
                  displayName: Texto ficticio
                  avatarUrl: null
                openedAt: null
                closedAt: null
                candidates: []
                outcome: null
                canManage: false
                canRecordTieWinner: false
                curatedByMe: false
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
          csrfHeader: []
  /api/votes/{voteId}:
    get:
      operationId: getVote
      summary: getVote
      description: Approved membership rechecked before data lookup. See docs/api.md for server
