          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque voteId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TieWinnerInput"
            example:
              bookId: book-fiction-1
              note: Texto ficticio
  /api/books/{bookId}/ratings:
    get:
      operationId: getBookRatings
      summary: getBookRatings
      description: 401 before book lookup. Ratings gate finished AND own complete review, including
