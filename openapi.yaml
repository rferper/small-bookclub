  /api/votes/{voteId}/candidates:
    post:
      operationId: addCandidate
      summary: addCandidate
      description: 401 then current curator/admin 403 before lookup, vote/book 404 then
        closed/duplicate/non-propuesto book 409, invalid input 400. Append candidate.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
              example:
                id: book-fiction-1
                status: draft
                curator:
                  id: book-fiction-1
                  displayName: Texto ficticio
                  avatarUrl: null
                openedAt: null
                closedAt: null
                candidates: []
                outcome: null
                canManage: false
                canRecordTieWinner: false
                curatedByMe: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
