      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
              example:
                id: book-fiction-1
                title: Texto ficticio
                authors: []
                coverUrl: null
                status: propuesto
                readingStartDate: null
                readingEndDate: null
                datesApproximate: false
                plannedStartDate: null
                plannedEndDate: null
                description: null
                publicationDate: null
                publisher: null
                isbn: null
                pageCount: null
                schedule: []
                meetings: []
                originVote: null
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque bookId.
  /api/meetings:
    get:
      operationId: listMeetings
      summary: listMeetings
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingList"
              example:
                upcoming: []
                past: []
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
  /api/meetings/{meetingId}:
    get:
      operationId: getMeeting
      summary: getMeeting
      description: Central MeetingRecord gate includes admin member views; published content only;
        cancelled/removed linked week suppress substantive records.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDetail"
              example:
                id: book-fiction-1
                startsAt: 2026-01-15T19:00:00Z
                cancelled: false
                book: null
                assignment: null
                upcoming: false
                attendance: null
                record:
                  status: visible
                  summary: null
                  highlights: []
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
          description: Opaque meetingId.
  /api/votes:
    get:
      operationId: getVotes
      summary: getVotes
      description: Approved membership rechecked before data lookup. See docs/api.md for server
        obligations and error precedence.
      tags:
        - Member
      responses:
        "200":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotesOverview"
              example:
                curator: null
                current: null
                history: []
                canCreateVote: false
        "401":
          $ref: "#/components/responses/Error401"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      security:
        - sessionCookie: []
    post:
      operationId: createVote
      summary: createVote
      description: 401 then effective current curator/admin permission 403; missing curator or existing
        draft/open 409. Empty draft shortlist belongs to current curator even when admin creates. No
        request body.
      tags:
        - Member
      responses:
        "201":
          description: Successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"
              example:
                id: book-fiction-1
                status: draft
                curator:
                  id: book-fiction-1
                  displayName: Texto ficticio
                  avatarUrl: null
                openedAt: null
                closedAt: null
                candidates: []
                outcome: null
                canManage: false
                canRecordTieWinner: false
                curatedByMe: false
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
