name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend lint, unit, integration and contract
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BOOKCLUB_ENV: test
      DATABASE_PATH: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.7'
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run python manage.py check
      - run: uv run ruff check . ../deploy/render/entrypoint.py
      - run: uv run ruff format --check . ../deploy/render/entrypoint.py
      - run: uv run pytest -m "not integration"
      - run: uv run pytest -m integration
      - run: uv run python -m config.contract

  frontend:
    name: Frontend lint, tests, contract, build and accessibility
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run validate:contract
      - run: npm run check:api
      - run: npm run test:contract
      - run: npm run test:type-boundaries
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  containers:
    name: Build images and run native browser journeys
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose config --quiet
      - run: docker compose build
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: node deploy/verify-production.mjs
      - run: node deploy/render/verify.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-browser-failures
          path: frontend/test-results/e2e/
          retention-days: 3

  required:
    name: All CI checks passed
    if: always()
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CONTAINERS_RESULT" = success
