name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let an active main delivery finish; branch/PR verification stays cancellable.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend lint, unit, integration and contract
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BOOKCLUB_ENV: test
      DATABASE_PATH: ':memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.7'
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run python manage.py check
      - run: node --test ../deploy/render/release.test.mjs ../deploy/render/record-release.test.mjs ../deploy/render/verify-diagnostics.test.mjs
      - run: uv run ruff check . ../deploy/render/entrypoint.py
      - run: uv run ruff format --check . ../deploy/render/entrypoint.py
      - run: uv run pytest -m "not integration"
      - run: uv run pytest -m integration
      - run: uv run python -m config.contract

  frontend:
    name: Frontend lint, tests, contract, build and accessibility
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run validate:contract
      - run: npm run check:api
      - run: npm run test:contract
      - run: npm run test:type-boundaries
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  containers:
    name: Build images and run native browser journeys
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose config --quiet
      - run: docker compose build
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: node deploy/verify-production.mjs
      - run: node deploy/render/verify.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-browser-failures
          path: |
            frontend/test-results/e2e/
            /tmp/bookclub-production-check-*/production-https.png
            /tmp/bookclub-render-check-*/staging.png
            /tmp/bookclub-render-check-*/production-demo.png
            /tmp/bookclub-render-check-*/staging-verifier.png
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-browser-verification
          path: |
            /tmp/bookclub-production-check-*/production-https.png
            /tmp/bookclub-render-check-*/staging.png
            /tmp/bookclub-render-check-*/production-demo.png
          if-no-files-found: error
          retention-days: 3

  required:
    name: All CI checks passed
    if: always()
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CONTAINERS_RESULT" = success

  deploy:
    needs: required
    permissions:
      contents: write # Reusable workflow narrows this to its final tag job.
    if: needs.required.result == 'success' && github.repository == 'rferper/small-bookclub' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      ci_passed: ${{ needs.required.result == 'success' }}
    secrets:
      RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
      RENDER_DEMO_DEPLOY_HOOK: ${{ secrets.RENDER_DEMO_DEPLOY_HOOK }}
